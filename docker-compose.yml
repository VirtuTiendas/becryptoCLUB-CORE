version: '3.9'
services:
  app:
    image: laravelphp/v11-php82
    container_name: becrypto-app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - db
      - redis
  web:
    image: nginx:1.25-alpine
    container_name: becrypto-web
    volumes:
      - ./:/var/www/html
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
  db:
    image: mysql:8
    container_name: becrypto-db
    environment:
      MYSQL_DATABASE: becryptoclub
      MYSQL_USER: becrypto
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
  redis:
    image: redis:7-alpine
    container_name: becrypto-redis
    ports:
      - "6379:6379"
